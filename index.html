<style>
/* VOICE: calm and assured, like a show-suite sales gallery
   IDEA: the architect's floor plan you can step into
   PICTURE: a live, physically lit 3D interior, with the plan as an inset map and a full overview
   COLOUR and TYPE: warm stone ground, walnut ink, oak, one teal taken from the water feature; Marcellus + Figtree
   LAYOUT: stage on the left, room dossier on the right; on phones the stage sits above a scrolling dossier */
:root{color-scheme:light dark;
--bg:light-dark(#efe9e1,#151210);--panel:light-dark(#fbf8f3,#1e1a16);--ink:light-dark(#2b2119,#f0e7dc);--muted:light-dark(#76675a,#a8998a);
--line:light-dark(#e1d7ca,#352d26);--oak:#b07a4a;--teal:light-dark(#15737e,#5cc2cc);--teal-soft:light-dark(#d3eaec,#1d3a3d);
--p-oak:light-dark(#ecdcc8,#3a2e24);--p-marble:light-dark(#f1e7d8,#3b342b);--p-stone:light-dark(#f4f0ea,#2f2b27);--p-tile:light-dark(#e2e0dc,#2b2a28);--p-deck:light-dark(#dfd8cd,#29261f);
--p-hov:light-dark(#e0c9ad,#4a3a2c);--blk:light-dark(#8d8379,#5a514a);--glass:light-dark(#5f9ca7,#5cc2cc);--water:light-dark(#a9d8de,#28555b);
--hud:light-dark(rgba(251,248,243,.9),rgba(30,26,22,.88))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
h1,h2{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px max(2vw,16px);border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:26px}
header .sub{font-size:13px;color:var(--muted)}
.brand{margin-inline-end:auto}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:0 16px;min-height:38px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;text-decoration:none}
.btn.pri{background:var(--teal);border-color:var(--teal);color:light-dark(#fff,#0d1f21)}
.btn:focus-visible,.seg button:focus-visible,.lbl:focus-visible,.idx button:focus-visible,.rm:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 384px;min-height:0}
.stage{position:relative;min-height:0;background:#2a241f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.gl{position:absolute;inset:0}.gl canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.gl canvas:active{cursor:grabbing}
.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;border:0;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--hud);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18);display:none;will-change:transform}
.lbl.on{background:var(--teal);color:light-dark(#fff,#0d1f21)}
.hud{position:absolute;display:flex;gap:8px;align-items:center}
.chip{background:var(--hud);border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.15);backdrop-filter:blur(6px)}
.chip b{font-weight:600}
.tl{top:12px;left:12px}.tr{top:12px;right:12px;flex-direction:column;align-items:flex-end}
.tr .row{display:flex;gap:8px}
.ib{min-height:44px;min-width:44px;border:0;border-radius:999px;background:var(--hud);cursor:pointer;padding:0 14px;font-size:14px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.ib[aria-pressed=true]{background:var(--teal);color:light-dark(#fff,#0d1f21)}
.mm{width:170px;background:var(--hud);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;border:0}
.mm svg{display:block;width:100%;height:auto}
.bc{bottom:14px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px)}
.hint{font-size:13px;color:var(--ink);transition:opacity .6s}
.tourbar{display:flex;align-items:center;gap:6px;background:var(--hud);border-radius:999px;padding:5px 5px 5px 16px;box-shadow:0 4px 18px rgba(0,0,0,.22)}
.tourbar .t{display:flex;flex-direction:column;line-height:1.2;margin-inline-end:8px;white-space:nowrap}
.tourbar .t small{font-size:12px;color:var(--muted)}
.tourbar .t b{font-weight:600;font-size:15px}
.tourbar button{min-height:40px;min-width:40px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:600;padding:0 10px}
.tourbar button.x{background:var(--bg)}
.joy{position:absolute;left:18px;bottom:18px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.planview{position:absolute;inset:0;background:var(--bg);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:16px}
.planview svg{width:100%;height:100%}
.planfoot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding-top:8px}
.key{display:flex;flex-wrap:wrap;gap:6px 14px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.rm{cursor:pointer;transition:fill .2s}
.rm.oak{fill:var(--p-oak)}.rm.stone{fill:var(--p-stone)}.rm.tile{fill:var(--p-tile)}.rm.deck{fill:var(--p-deck)}.rm.open{fill:var(--p-oak)}.rm.marble{fill:var(--p-marble)}
.rm:hover{fill:var(--p-hov)}.rm.on{fill:var(--teal-soft);stroke:var(--teal);stroke-width:5}
.slab{fill:var(--p-marble)}
.wl{stroke:var(--ink);stroke-linecap:square}.wl.x{stroke-width:11}.wl.w{stroke-width:6}.wl.g{stroke:var(--glass);stroke-width:5}.wl.r{stroke:var(--glass);stroke-width:3;stroke-dasharray:8 6}
.blk{fill:var(--blk)}.pool{fill:var(--water);stroke:var(--glass);stroke-width:3}
.route{fill:none;stroke:var(--oak);stroke-width:4;stroke-dasharray:1 12;stroke-linecap:round;pointer-events:none}
.pt{font:600 20px Figtree,sans-serif;fill:var(--ink);text-anchor:middle;pointer-events:none}
.pd{font:500 15px Figtree,sans-serif;fill:var(--muted);text-anchor:middle;pointer-events:none}
.pin{fill:var(--panel);stroke:var(--teal);stroke-width:5;pointer-events:none}
.me .dot{fill:var(--teal);stroke:#fff;stroke-width:5}.me .cone{fill:var(--teal);opacity:.28}
.mini .me .dot{stroke-width:8}.mini .rm{cursor:pointer}
.loading .wl{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
aside{overflow:auto;border-left:1px solid var(--line);background:var(--panel)}
.card{padding:20px}
.photo{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);padding:16px}
.ph .sw{position:absolute;inset:0;opacity:.55}
.ph span{position:relative}
.pacts{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.pacts label,.pacts button{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:var(--hud);border:0;cursor:pointer;font-size:13px;font-weight:600}
.pacts input{position:absolute;width:1px;height:1px;opacity:0}
.grp{font-size:13px;color:var(--muted);margin:18px 0 4px}
.card h2{font-size:34px}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.dims div{background:var(--panel);padding:10px 12px}
.dims small{display:block;font-size:12px;color:var(--muted)}
.dims b{font-weight:600;font-size:17px;white-space:nowrap}
.dims .full{grid-column:1/-1}
.card p{margin:0 0 14px}
.fin{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.fin li{display:flex;gap:10px;align-items:center;font-size:15px}
.fin i{width:22px;height:22px;border-radius:6px;flex:none;border:1px solid rgba(0,0,0,.12)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.idx{border-top:1px solid var(--line);padding:16px 20px 8px}
.idx h3{font:600 13px Figtree,sans-serif;color:var(--muted);margin:14px 0 6px}
.idx button{display:flex;width:100%;justify-content:space-between;gap:12px;min-height:44px;align-items:center;border:0;background:none;padding:0 10px;border-radius:10px;cursor:pointer;text-align:start}
.idx button:hover{background:var(--bg)}
.idx button[aria-current=true]{background:var(--teal-soft)}
.idx button small{color:var(--muted);font-size:13px;white-space:nowrap}
.note{font-size:13px;color:var(--muted);padding:8px 20px 24px}
.loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .6s}
.loader.done{opacity:0;pointer-events:none}
.lw{width:min(340px,80vw);text-align:center}
.lw svg{width:180px;height:auto;margin:0 auto 18px;display:block}
.lw h1{font-size:32px;margin-bottom:14px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.lw p{font-size:14px;color:var(--muted);margin:10px 0 0}

.photoview{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:18px max(2vw,16px) 28px}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.phead h2{font-size:34px}.phead p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.pcard{border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden;padding:0;text-align:start;cursor:pointer;display:block;width:100%}
.pcard.on{outline:3px solid var(--teal);outline-offset:2px}.pcard:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pimg{aspect-ratio:16/10;background:linear-gradient(110deg,var(--bg) 30%,var(--line) 50%,var(--bg) 70%);background-size:300% 100%;animation:shim 1.6s linear infinite;display:grid;place-items:center;color:var(--muted);font-size:13px}
.pimg.done{animation:none;background:var(--bg)}.pimg img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes shim{to{background-position:-150% 0}}
.pcap{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;font-size:14px}.pcap b{font-weight:600}.pcap small{color:var(--muted);white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:default}
.lb{position:fixed;inset:0;z-index:60;background:rgba(14,11,9,.95);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:16px;gap:12px}
.lb img{width:100%;height:100%;object-fit:contain;min-height:0}
.lbbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;color:#f3ece3}
.lbt{display:flex;flex-direction:column;min-width:170px;text-align:center;line-height:1.3}.lbt small{color:#bfb3a5;font-size:13px}
.lb .ib{background:rgba(255,255,255,.12);color:#f3ece3;box-shadow:none}
.photo .tag{position:absolute;left:10px;top:10px;background:var(--hud);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}

.pimg{position:relative}.badge{position:absolute;left:8px;top:8px;background:var(--teal);color:light-dark(#fff,#0d1f21);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.ptbar{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:220px}
.ptbar .track{height:4px;width:min(320px,70vw);background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}.ptbar .track i{display:block;height:100%;background:#5cc2cc;transition:width .4s}
.phact{display:flex;flex-wrap:wrap;gap:8px}.lberr{flex-basis:100%;text-align:center;color:#f2a58e;font-size:14px;margin:4px 0 0}.perr{color:#b4462f;font-size:14px;margin:8px 0 0}
@media(prefers-reduced-motion:reduce){.pimg{animation:none}}
@media(max-width:860px){
 .app{height:auto}main{grid-template-columns:minmax(0,1fr)}
 .stage{height:62vh;height:62svh}aside{border:0;overflow:visible}
 .mm{width:112px}header h1{font-size:22px}
 .card h2{font-size:30px}
}
@media(max-width:520px){.seg button{padding:0 12px}.tourbar .t{max-width:120px;overflow:hidden}.tourbar .t b{overflow:hidden;text-overflow:ellipsis}}
@media(prefers-reduced-motion:reduce){.loading .wl{animation:none;stroke-dashoffset:0}.loader,.hint{transition:none}}
.fade{position:absolute;inset:0;background:#15110d;opacity:0;transition:opacity .24s;pointer-events:none}
.sets{position:absolute;top:66px;right:12px;width:min(300px,calc(100% - 24px));background:var(--hud);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:5;display:grid;gap:12px;font-size:14px}
.sets .lab{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.sets input[type=range]{width:100%;accent-color:var(--teal);height:28px;margin:0}

.opts button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tog{display:flex;justify-content:space-between;align-items:center;min-height:40px;border:0;background:none;padding:0;cursor:pointer;width:100%;font-weight:600}

.tog[aria-pressed=true] i{background:var(--teal)}.tog[aria-pressed=true] i::after{transform:translateX(16px)}
.sets .opts button:focus-visible,.tog:focus-visible,.ib:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
/* 360° tour */
.pgl{position:absolute;inset:0}.pgl canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}.pgl canvas:active{cursor:grabbing}
.phs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;width:0;height:0;transform:translate(-9999px,0);transition:opacity .3s;will-change:transform}
.phs.moving .hs{opacity:0}.phs.moving .hs *{pointer-events:none!important}
.hs.go{border:0;padding:0;background:none;cursor:pointer;color:#fff}
.hs.go i,.hs.go span,.hs.info button,.hs.info .tip{pointer-events:auto}
.hs.go i{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;border:2.5px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.75) 0 20%,rgba(255,255,255,.14) 22%);box-shadow:0 0 0 8px rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.35);transform:perspective(240px) rotateX(60deg);transition:background .2s,box-shadow .2s}
.hs.go span{position:absolute;left:0;bottom:22px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.01em;background:rgba(24,19,15,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hs.go:hover i,.hs.go:focus-visible i{background:radial-gradient(circle,#fff 0 20%,rgba(92,194,204,.6) 22%);box-shadow:0 0 0 10px rgba(92,194,204,.25),0 10px 24px rgba(0,0,0,.35)}
.hs.go:focus-visible{outline:none}.hs.go:focus-visible span{outline:3px solid #5cc2cc;outline-offset:2px}
.hs.go.wait i{border-color:rgba(255,255,255,.3);border-top-color:#fff;animation:hsspin .8s linear infinite}
@keyframes hsspin{to{transform:perspective(240px) rotateX(60deg) rotate(360deg)}}
.hs.info button{position:absolute;left:-17px;top:-17px;width:34px;height:34px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(21,115,126,.85);color:#fff;cursor:pointer;font:italic 600 17px/1 Georgia,serif;animation:hspulse 2.6s ease-out infinite}
.hs.info button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes hspulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%,100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}

.hs.info .tip b{display:block;font:400 19px/1.15 Marcellus,Georgia,serif;margin-bottom:4px}.hs.info .tip p{margin:0;color:var(--muted)}
.hs.info.open{z-index:3}
.chip .kind{margin-inline-start:10px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}.chip .kind.ok{background:var(--teal);color:light-dark(#fff,#0d1f21)}
.hud.mc{top:50%;left:50%;transform:translate(-50%,-50%)}
.hud.ec{top:64px;left:12px;max-width:min(520px,calc(100% - 210px))}
.chip.busy{display:flex;align-items:center;gap:10px;font-weight:500}
.chip.err{display:flex;gap:8px;align-items:flex-start;border-radius:14px;color:light-dark(#8a2a17,#f2a58e)}.chip.err .x{border:0;background:none;cursor:pointer;padding:0 2px;color:inherit;font-weight:600;min-height:24px}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--teal);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pp{fill:var(--panel);stroke:var(--teal);stroke-width:4}.pp.has{fill:var(--teal-soft)}.pp.on{fill:var(--teal)}.pp.tap{cursor:pointer}.pp.tap:hover{stroke-width:7}

.key i.kp{border-radius:50%;background:var(--panel);border:2px solid var(--teal)}
.alignbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;background:var(--hud);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.22);width:min(880px,calc(100vw - 24px))}
.alignbar .t{display:flex;flex-direction:column;line-height:1.25;margin-inline-end:auto}.alignbar .t small{font-size:12px;color:var(--muted)}.alignbar .t b{font-weight:600;font-size:14px}
.alignbar .rng{display:flex;flex-direction:column;font-size:12px;font-weight:600;min-width:150px;flex:1}.alignbar input[type=range]{accent-color:var(--teal);width:100%;height:26px;margin:0}
.alignbar button{min-height:40px;min-width:40px;border:0;border-radius:999px;background:var(--bg);cursor:pointer;font-weight:600;padding:0 14px}.alignbar button.ok{background:var(--teal);color:light-dark(#fff,#0d1f21)}
.alignbar button:focus-visible,.tourbar button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.rpanel{z-index:6}
.rh{font:600 13px Figtree,sans-serif;color:var(--muted);margin:22px 0 8px}
.rlist{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(140px,1fr) 156px minmax(0,1.5fr);gap:8px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rn b{display:block;font-weight:600}.rn small{display:block;color:var(--muted);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.rs{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap;justify-self:start}.rs.ok{background:var(--teal);color:light-dark(#fff,#0d1f21)}
.ra{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;position:relative}
.ra input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.ra label:focus-within{outline:3px solid var(--teal);outline-offset:2px}
.rmsg{display:flex;gap:10px;align-items:center;color:var(--ink)!important;font-weight:500}
.rnote{font-size:13px;color:var(--muted);max-width:75ch;margin:20px 0 0}
.sload{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:var(--bg);text-align:center}
.sload h2{font-size:28px;margin-bottom:14px}
.tog[disabled]{opacity:.45;cursor:default}
.sets .btn{width:100%}
.seg .sm{display:none}
@media(max-width:560px){.seg .lg{display:none}.seg .sm{display:inline}.seg button{padding:0 14px}}
@media(max-width:700px){.rrow{grid-template-columns:minmax(0,1fr) auto}.rs{justify-self:end}.ra{grid-column:1/-1;justify-content:flex-start}.hud.ec{max-width:calc(100% - 140px)}}
@media(prefers-reduced-motion:reduce){.hs.info button,.hs.go.wait i,.spin{animation:none}.hs{transition:none}}

 if(man&&man.yaw&&typeof man.yaw==='object')for(const k in man.yaw){const v=+man.yaw[k];if(PANO[k]&&isFinite(v))yaw[k]=v}
 if(man&&man.renders&&typeof man.renders==='object'){for(const k in man.renders)if(PANO[k]&&typeof man.renders[k]==='string')files[k]='pano/'+man.renders[k]}

const pdb=(()=>{let dbp=null,ok=typeof indexedDB!=='undefined';const mem=new Map();
 const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('walkthrough-panos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
 const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}));
 const fall=f=>e=>{ok=false;console.warn('[walkthrough] renders kept for this visit only',e);return f()};
 return{get:k=>ok?tx('readonly',s=>s.get(k)).catch(fall(()=>mem.get(k))):Promise.resolve(mem.get(k)),
  put:(k,v)=>ok?tx('readwrite',s=>s.put(v,k)).catch(fall(()=>{mem.set(k,v)})):Promise.resolve(mem.set(k,v)),
  del:k=>ok?tx('readwrite',s=>s.delete(k)).catch(fall(()=>{mem.delete(k)})):Promise.resolve(mem.delete(k)),
  keys:()=>ok?tx('readonly',s=>s.getAllKeys()).catch(fall(()=>[...mem.keys()])):Promise.resolve([...mem.keys()])}})();
async function decodeImg(blob,maxW){let src=null,close=()=>{};
 if(typeof createImageBitmap==='function'){try{src=await createImageBitmap(blob);close=()=>{try{src.close()}catch(e){}}}catch(e){src=null}}
 if(!src)src=await new Promise((res,rej)=>{const url=URL.createObjectURL(blob),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);res(im)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('the file could not be read as an image'))};im.src=url});
 const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;
 if(w>maxW){const c=document.createElement('canvas');c.width=maxW;c.height=Math.round(h*maxW/w);const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(src,0,0,c.width,c.height);close();return{src:c,w,h,close:()=>{}}}

function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}

 useEffect(()=>{V.current&&V.current.setActive(view==='tour'&&!rpan)},[view,rpan]);
 useEffect(()=>{if(!pc.pend){setSlow(false);return}const t=setTimeout(()=>setSlow(true),300);return()=>clearTimeout(t)},[pc.pend]);
 useEffect(()=>{const e=eng.current;if(!e)return;e.setExposure(set.exposure);e.setLights(set.lights);e.setLens(set.lens);e.setBob(set.bob)},[set,engOn]);
 useEffect(()=>{eng.current&&eng.current.setQuality(set.quality)},[set.quality]);
 useEffect(()=>{eng.current&&eng.current.setActive(view==='walk')},[view,engOn]);
 useEffect(()=>{if(view==='walk'||view==='photo')ensureEngine().catch(()=>{})},[view]);
 useEffect(()=>{if(view==='walk'&&(engOn||err)&&boot)setBoot(false)},[view,engOn,err,boot]);
 useEffect(()=>{eng.current&&eng.current.highlight(sel)},[sel,engOn]);
 useEffect(()=>{if(view!=='plan'||!pv.current)return;const o=new ResizeObserver(([e])=>setCompact(e.contentRect.width<620));o.observe(pv.current);return()=>o.disconnect()},[view]);
 useEffect(()=>{if(view!=='tour'||lb||rpan)return;const k=e=>{const t=e.target;if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;const v=V.current;if(!v)return;
  const K=e.key;if(K==='ArrowLeft')v.kick(-70,0);else if(K==='ArrowRight')v.kick(70,0);else if(K==='ArrowUp')v.kick(0,45);else if(K==='ArrowDown')v.kick(0,-45);else if(K==='+'||K==='=')v.zoomBy(.85);else if(K==='-'||K==='_')v.zoomBy(1.18);else return;
  e.preventDefault();TC.current&&TC.current.interact();setHint360(false)};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[view,lb,rpan]);

 const renderAll=all=>{const e=eng.current;if(!e||rendering.current)return;const ids=PHOTO_IDS.filter(id=>all?!ptDone[id]:!shots[id]);if(!ids.length)return;if(all)setShots(v=>Object.fromEntries(Object.entries(v).filter(([k])=>ptDone[k])));
  const order=ids.includes(sel)?[sel,...ids.filter(i=>i!==sel)]:ids;rendering.current=true;setRend({done:0,total:order.length});
  e.renderShots(order,(id,url)=>{setShots(s=>({...s,[id]:url}));setRend(r=>r&&{...r,done:r.done+1})}).catch(err=>console.error(err)).finally(()=>{rendering.current=false;setRend(null)})};
 useEffect(()=>{if(view==='photo'&&engOn)renderAll(false)},[view,engOn]);
 const runPT=async ids=>{const e=eng.current;if(!e||rendering.current||!ids.length)return;const sig={stop:false};ptStop.current=sig;rendering.current=true;setPtErr(null);
  try{for(const id of ids){if(sig.stop)break;const q=PTQ[set.quality]||PTQ.bal;setPt({id,samples:0,target:q.spp,preview:null,msg:null});
    const res=await e.pathTrace(id,{...q,signal:sig},(n,prev,msg)=>setPt(p=>p&&{...p,samples:n,preview:prev||p.preview,msg:msg||null}));
    setShots(x=>({...x,[id]:res.url}));setPtDone(d=>({...d,[id]:res.samples}))}}
  catch(err){console.error('[walkthrough] photoreal render failed',err);setPtErr('Photoreal rendering stopped: '+(err&&err.message||err)+'.')}
  finally{rendering.current=false;setPt(null)}};
 const lbIds=PHOTO_IDS.filter(id=>shots[id]);const lbStep=d=>setLb(c=>{const i=lbIds.indexOf(c);return lbIds[(i+d+lbIds.length)%lbIds.length]||c});
 useEffect(()=>{if(!lb)return;const k=e=>{if(e.key==='Escape')setLb(null);else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='ArrowLeft')lbStep(-1)};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[lb,shots]);
 const save=n=>{try{localStorage.setItem(PK,JSON.stringify(n))}catch(e){}return n};
 const onPhoto=async(id,f)=>{try{const u=await shrink(f);setPhotos(p=>save({...p,[id]:u}))}catch(e){}};
 const onDel=id=>setPhotos(p=>{const n={...p};delete n[id];return save(n)});
 const toStage=()=>{if(innerWidth<=860&&stage.current)stage.current.scrollIntoView({behavior:'smooth'})};
 const goWalk=id=>{setSel(id);setView('walk');setAerialS(false);ensureEngine().then(e=>e.teleport(id)).catch(()=>{});toStage()};
 const go360=(id,isPano)=>{const p=isPano?id:panoOf(id);setView('tour');setRpan(false);setInfo(null);if(align)endAlign(false);TC.current&&TC.current.go(p,{how:'jump'});toStage()};
 const goLink=id=>{const tc=TC.current;if(!tc)return;tc.interact();tc.go(id,{how:'link'});setHint360(false);setInfo(null)};
 const pick=id=>{setSel(id);if(view==='tour'){go360(id);return}if(innerWidth<=860&&aside.current)aside.current.scrollIntoView({behavior:'smooth'})};
 const startTour3D=()=>{setView('walk');setAerialS(false);setHint(false);ensureEngine().then(e=>e.startTour()).catch(()=>{})};
 const start360=()=>{setView('tour');setRpan(false);setShowT(false);setHint360(false);if(align)endAlign(false);TC.current&&TC.current.startTour()};
 const tourOn=view==='walk'?tour.on:!!pc.tour;
 const tourBtn=()=>{if(view==='walk'){if(tour.on)eng.current&&eng.current.stopTour();else startTour3D()}else if(pc.tour)TC.current.stopTour();else start360()};
 const toggleAerial=()=>{const v=!aerial;setAerialS(v);eng.current&&eng.current.setAerial(v)};
 const fs=()=>{const el=stage.current;try{if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}catch(e){}};
 const toggleGyro=async()=>{const v=V.current;if(!v)return;try{await v.setGyro(!gyro);setGyroS(!gyro);setHint360(false);TC.current&&TC.current.interact()}catch(e){setPerr('Motion control is not available here: '+(e&&e.message||e)+'.')}};
 // final renders: add, remove, align, reference panoramas for the artist
 const addRender=async(id,file)=>{setRmsg(null);setWork('Checking '+file.name);
  try{const im=await decodeImg(file,1e9),w=im.w,h=im.h;im.close();
   if(Math.abs(w/h-2)>.02)throw new Error(`${file.name} is ${w} × ${h} px. A 360° panorama must be exactly twice as wide as it is tall, for example 8192 × 4096.`);
   await pdb.put(id,file);setFin(f=>{const n={...f,[id]:'upload'};finR.current=n;return n});TC.current&&TC.current.invalidate(id);
   setRmsg(`${pName(id)}: ${w} × ${h} px render added.${w<6000?' For a crisp view on large screens, ask the artist for 8192 × 4096.':''}`)}
  catch(e){setRmsg(String(e&&e.message||e))}finally{setWork(null)}};
 const delRender=async id=>{await pdb.del(id).catch(()=>{});setFin(f=>{const n={...f};if(siteR.current[id])n[id]='site';else delete n[id];finR.current=n;return n});TC.current&&TC.current.invalidate(id);setRmsg(pName(id)+': render removed from this browser.')};
 const refPano=async id=>{setRmsg(null);setWork('Rendering the reference panorama for '+pName(id));
  try{const v=V.current,tex=await preview(id,1536,Math.min(4096,v.maxTex)),c=v.read(tex);v.free(tex);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));if(!blob)throw new Error('the image could not be encoded');setWork(null);const r=await saveFile(blob,id+'-reference.jpg');setRmsg(r==='declined'?'Download cancelled.':'Saved '+id+'-reference.jpg.')}
  catch(e){setRmsg('Could not render the reference: '+(e&&e.message||e))}finally{setWork(null)}};
 const dlManifest=async()=>{const y={...manR.current,...yaws};try{const r=await saveFile(new Blob([JSON.stringify({yaw:y},null,2)],{type:'application/json'}),'manifest.json');setRmsg(r==='declined'?'Download cancelled.':'Saved manifest.json. Put it in the pano folder next to the renders.')}catch(e){setRmsg('Could not save manifest.json: '+(e&&e.message||e))}};
 const startAlign=async id=>{setRpan(false);setView('tour');setShowT(false);const tc=TC.current,v=V.current;if(!tc||!v)return;if(tc.current()!==id&&!(await tc.go(id,{how:'jump'})))return;
  setWork('Rendering the 3D preview to align against');try{const tex=await preview(id,FACE[setR.current.quality]||1152,Math.min(4096,v.maxTex));v.ghost(tex,.5,0);setAlign({id,yaw:yawOf(id),tex,mix:.5})}
  catch(e){setPerr('Could not start aligning: '+(e&&e.message||e))}finally{setWork(null)}};
 const alignYaw=y=>{if(!align)return;y=Math.round((((y+180)%360+360)%360-180)*2)/2;V.current.setYaw(y);setAlign({...align,yaw:y})};
 const alignMix=m=>{if(!align)return;V.current.ghost(align.tex,m,0);setAlign({...align,mix:m})};
 function endAlign(keep){const a=align;if(!a)return;const v=V.current;v.ghost(null);v.free(a.tex);
  if(keep){const n={...yaws,[a.id]:a.yaw};try{localStorage.setItem(YK,JSON.stringify(n))}catch(e){}yawR.current=n;setYaws(n);TC.current.setYaw(a.id,a.yaw)}else v.setYaw(yawOf(a.id));setAlign(null)}

 const r=byId[sel];const hereR=byId[here];const tr=tour.on&&byId[tour.id];const curKind=pc.id&&TC.current?TC.current.kindOf(pc.id):null;
 const route=mode==='walk'?TOUR.map(t=>t.p):null;
 const lg=(a,b)=>html`<span className="lg">${a}</span><span className="sm" aria-hidden="true">${b}</span>`;
 return html`<div className="app">
  <header>
   <div className="brand"><h1>Residence walkthrough</h1><div className="sub">30th floor · sea-facing · three suites · spa · four balconies · 12'-0" ceilings</div></div>
   <div className="seg" role="group" aria-label="View"><button aria-pressed=${view==='walk'} aria-label="3D model" onClick=${()=>setView('walk')}>${lg('3D model','3D')}</button><button aria-pressed=${view==='tour'} aria-label="360° tour" onClick=${()=>setView('tour')}>${lg('360° tour','360°')}</button><button aria-pressed=${view==='plan'} aria-label="Floor plan" onClick=${()=>setView('plan')}>${lg('Floor plan','Plan')}</button><button aria-pressed=${view==='photo'} aria-label="Photo mode" onClick=${()=>setView('photo')}>${lg('Photo mode','Photos')}</button></div>
   <button className="btn pri" onClick=${tourBtn}>${tourOn?'End tour':'Start guided tour'}</button>
  </header>
  <main>
   <section className="stage" ref=${stage} aria-label=${view==='walk'?'3D walkthrough':'360° tour'}>
    <div className="gl" ref=${host}></div>
    <div className="pgl" ref=${ph} style=${{display:view==='tour'?'block':'none'}}></div>
    <div className="phs" ref=${hsr} style=${{display:view==='tour'?'block':'none'}}>${spots.map(s=>s.k==='go'
     ?html`<button key=${'g'+s.id} className=${'hs go'+(pc.pend===s.id?' wait':'')} data-h=${s.h.toFixed(2)} data-e=${s.e.toFixed(2)} onClick=${()=>goLink(s.id)} aria-label=${'Go to '+pName(s.id)}><i></i><span>${s.label}</span></button>`
     :html`<div key=${'i'+s.id} className=${'hs info'+(info===s.id?' open':'')} data-h=${s.h.toFixed(2)} data-e=${s.e.toFixed(2)}><button onClick=${()=>setInfo(info===s.id?null:s.id)} aria-expanded=${info===s.id} aria-label=${s.label}><i>i</i></button>${info===s.id&&html`<div className="tip" role="note"><b>${s.label}</b><p>${s.text}</p></div>`}</div>`)}</div>
    <div className="lbls" ref=${lbl} style=${{display:view==='walk'?'block':'none'}}>${ROOMS.map(x=>html`<button key=${x.id} data-id=${x.id} className=${'lbl'+(sel===x.id?' on':'')} onClick=${()=>setSel(x.id)}>${x.short||x.name}</button>`)}</div>
    ${view==='tour'&&html`<${React.Fragment}>
     <div className="hud tl"><div className="chip">${pc.id?html`<b>${pName(pc.id)}</b>${curKind==='preview'&&html`<span className="kind" title="Shown from the 3D model until the final render arrives">3D preview</span>`}`:'Opening the tour…'}</div></div>
     <div className="hud tr"><div className="row"><button className="ib" aria-pressed=${showT} onClick=${()=>setShowT(v=>!v)}>Settings</button>${touch&&html`<button className="ib" aria-pressed=${gyro} onClick=${toggleGyro}>Motion</button>`}<button className="ib" onClick=${fs} aria-label="Full screen">⤢</button></div>
      <button className="mm" onClick=${()=>setView('plan')} aria-label="Open floor plan"><${Plan} mini sel=${sel} pts cur=${pc.id} fin=${fin}/></button></div>
     ${!boot&&!rpan&&(work||pmsg||engBusy&&pc.pend||(slow&&pc.pend))&&html`<div className="hud mc"><div className="chip busy" role="status"><i className="spin"></i>${work||pmsg||(engBusy?`Building the 3D model for a preview · ${Math.round(prog.p*100)}%`:'Loading '+pName(pc.pend))}…</div></div>`}
     ${perr&&!boot&&html`<div className="hud ec"><div className="chip err" role="alert"><span>${perr}</span><button className="x" onClick=${()=>setPerr(null)} aria-label="Dismiss">✕</button></div></div>`}
     <div className="hud bc">${align?html`<div className="alignbar" role="group" aria-label="Align the final render">
       <div className="t"><small>Aligning ${pName(align.id)} · the 3D preview is laid over the render</small><b>Turn the render until the two line up</b></div>
       <label className="rng"><span>Heading ${align.yaw>0?'+':''}${align.yaw.toFixed(1)}°</span><input type="range" min="-180" max="180" step="0.5" value=${align.yaw} onChange=${e=>alignYaw(+e.target.value)}/></label>
       <button onClick=${()=>alignYaw(align.yaw-.5)} aria-label="Turn the render left half a degree">−</button><button onClick=${()=>alignYaw(align.yaw+.5)} aria-label="Turn the render right half a degree">+</button>
       <label className="rng"><span>Overlay ${Math.round(align.mix*100)}%</span><input type="range" min="0" max="1" step="0.05" value=${align.mix} onChange=${e=>alignMix(+e.target.value)}/></label>
       <button onClick=${()=>endAlign(false)}>Cancel</button><button className="ok" onClick=${()=>endAlign(true)}>Save</button></div>`
      :pc.tour?html`<div className="tourbar" role="group" aria-label="Guided 360° tour">
       <div className="t"><small>Stop ${pc.tour.k} of ${pc.tour.n}${pc.tour.paused?' · paused':''}</small><b>${pc.id?pName(pc.id):'On the move'}</b></div>
       <button onClick=${()=>TC.current.prev()} aria-label="Previous stop">‹</button>
       <button onClick=${()=>pc.tour.paused?TC.current.resumeTour():TC.current.pauseTour()}>${pc.tour.paused?'Resume':'Pause'}</button>
       <button onClick=${()=>TC.current.next()} aria-label="Next stop">›</button>
       <button className="x" onClick=${()=>TC.current.stopTour()} aria-label="End tour">✕</button></div>`
      :html`<div className="chip hint" style=${{opacity:hint360&&!boot?1:0}}>${touch?'Drag to look around · tap a floor ring to move':'Drag to look around · click a floor ring to move · scroll to zoom'}</div>`}</div>
     ${showT&&html`<${TourSettings} t=${tset} ut=${ut} s=${set} u=${u} anyFin=${anyFin} openRenders=${()=>{setShowT(false);setRmsg(null);setRpan(true)}}/>`}
     ${rpan&&html`<${Renders} fin=${fin} yaws=${{...manR.current,...yaws}} work=${work} msg=${rmsg} onAdd=${addRender} onDel=${delRender} onAlign=${startAlign} onRef=${refPano} onManifest=${dlManifest} onClose=${()=>setRpan(false)}/>`}
    </${React.Fragment}>`}
    ${view==='walk'&&html`<${React.Fragment}>
     <div className="hud tl"><div className="chip">${aerial?html`<b>Overhead view</b>`:html`You're in <b>${hereR?hereR.name:'the hall'}</b>`}</div></div>
     <div className="hud tr"><div className="row"><button className="ib" aria-pressed=${showSet} onClick=${()=>setShowSet(v=>!v)}>Settings</button><button className="ib" aria-pressed=${aerial} onClick=${toggleAerial}>${aerial?'Eye level':'Overhead'}</button><button className="ib" onClick=${fs} aria-label="Full screen">⤢</button></div>
      <button className="mm" onClick=${()=>setView('plan')} aria-label="Open floor plan"><${Plan} mini sel=${sel}/></button></div>
     <div className="hud bc">${tour.on?html`<div className="tourbar" role="group" aria-label="Guided tour">
       <div className="t"><small>Stop ${tour.k} of ${tour.n}${tour.paused?' · paused':''}</small><b>${tr?tr.name:'On the move'}</b></div>
       <button onClick=${()=>eng.current.prevStop()} aria-label="Previous stop">‹</button>
       <button onClick=${()=>tour.paused?eng.current.resumeTour():eng.current.pauseTour()}>${tour.paused?'Resume':'Pause'}</button>
       <button onClick=${()=>eng.current.nextStop()} aria-label="Next stop">›</button>
       <button className="x" onClick=${()=>eng.current.stopTour()} aria-label="End tour">✕</button></div>`
      :!aerial&&html`<div className="chip hint" style=${{opacity:hint?1:0}}>${touch?'Left pad to move · drag to look':'Drag to look · WASD or arrows to move · Shift to hurry'}</div>`}</div>
     ${touch&&!aerial&&!tour.on&&html`<${Joy} eng=${eng}/>`}
     ${showSet&&html`<${Settings} s=${set} u=${u}/>`}
    </${React.Fragment}>`}
    ${view==='photo'&&html`<div className="photoview">
     <div className="phead"><div><h2>Photo mode</h2><p>${rend?`Rendering quick previews: ${rend.done} of ${rend.total}…`:pt?`Path tracing ${byId[pt.id].name}: ${Math.floor(pt.samples)} of ${pt.target} samples${pt.msg?' · '+pt.msg:''}`:'Quick previews render automatically from the 3D model. Photoreal path-traces a room with full bounce light, soft sun and true reflections of the sea, then denoises it. Expect about 1–2 minutes per room at Balanced and 3–6 minutes at High on a typical laptop; you can stop early and still get a cleaned-up image.'}</p>${ptErr&&html`<p className="perr">${ptErr}</p>`}</div>
      <div className="phact">${pt?html`<button className="btn" onClick=${()=>{ptStop.current.stop=true}}>Stop</button>`:html`<button className="btn pri" disabled=${!!rend||!engOn} onClick=${()=>runPT(PHOTO_IDS.filter(id=>!ptDone[id]))}>Photoreal: all rooms</button><button className="btn" disabled=${!!rend||!engOn} onClick=${()=>renderAll(true)}>Refresh previews</button>`}</div></div>
     <div className="pgrid">${PHOTO_IDS.map(id=>{const x=byId[id],uu=shots[id];return html`<button key=${id} className=${'pcard'+(sel===id?' on':'')} onClick=${()=>{setSel(id);if(uu)setLb(id)}}><div className=${'pimg'+(uu?' done':'')}>${uu?html`<img src=${pt&&pt.id===id&&pt.preview||uu} alt=${'Render of '+x.name}/>`:html`<span>Waiting to render</span>`}${ptDone[id]?html`<span className="badge">Photoreal</span>`:pt&&pt.id===id?html`<span className="badge">Tracing ${Math.floor(pt.samples)}/${pt.target}</span>`:''}</div><div className="pcap"><b>${x.name}</b><small>${x.d?x.d.join(' × '):''}</small></div></button>`})}</div></div>`}
    ${view==='plan'&&html`<div className="planview" ref=${pv}>
     <${Plan} sel=${sel} onSel=${pick} compact=${compact} route=${route} pts cur=${pc.id} fin=${fin} onPt=${id=>go360(id,true)}/>
     <div className="planfoot"><div className="key"><span><i style=${{background:'var(--p-marble)'}}></i>Marble</span><span><i style=${{background:'var(--p-oak)'}}></i>Oak</span><span><i style=${{background:'var(--p-stone)'}}></i>Stone</span><span><i style=${{background:'var(--p-tile)'}}></i>Tile</span><span><i style=${{background:'var(--p-deck)'}}></i>Outdoor</span><span><i className="kp"></i>360° view</span><span><i style=${{background:'var(--teal)',borderRadius:'50%'}}></i>You</span></div>
      <span>${compact?'Tap a room for details, or a ring for its 360° view':'Click a room for details, or a ring to open its 360° view'+(route?' · the dotted line is the 3D tour route':'')}</span></div></div>`}
    ${(view==='walk'||view==='photo')&&!boot&&!engOn&&html`<div className="sload">${err?html`<div className="lw"><p>${err}</p></div>`:html`<div className="lw"><h2>Building the 3D model</h2><div className="bar"><i style=${{width:Math.round(prog.p*100)+'%'}}></i></div><p>${prog.m}…</p></div>`}</div>`}
   </section>
   <aside ref=${aside}>
    ${r&&html`<${Card} r=${r} photo=${photos[r.id]} render=${shots[r.id]} onPhoto=${onPhoto} onDel=${onDel} go360=${go360} goWalk=${goWalk} view=${view} toggleView=${()=>setView(view==='plan'?mode:'plan')}/>`}
    <nav className="idx" aria-label="Rooms">${GROUPS.map(g=>html`<div key=${g}><h3>${g}</h3>${ROOMS.filter(x=>x.g===g).map(x=>html`<button key=${x.id} aria-current=${sel===x.id} onClick=${()=>pick(x.id)}><span>${x.name}</span><small>${x.d?x.d.join(' × '):'—'}</small></button>`)}</div>`)}</nav>
    <div className="note">The 360° tour shows your 3D artist's final renders where they have been added, and previews from the 3D model everywhere else. The layout is scaled from the labelled room sizes on the floor plan. Photos you add stay in this browser only.</div>
   </aside>
  </main>
  ${lb&&shots[lb]&&html`<div className="lb" role="dialog" aria-modal="true" aria-label=${byId[lb].name+' render'} onClick=${e=>{if(e.target===e.currentTarget)setLb(null)}}>
   <img src=${pt&&pt.id===lb&&pt.preview||shots[lb]} alt=${'Render of '+byId[lb].name}/>
   <div className="lbbar"><button className="ib" onClick=${()=>lbStep(-1)} aria-label="Previous render">‹</button><div className="lbt"><b>${byId[lb].name}</b><small>${byId[lb].d?byId[lb].d.join(' × '):'Not dimensioned'}</small></div><button className="ib" onClick=${()=>lbStep(1)} aria-label="Next render">›</button>
    ${pt&&pt.id===lb?html`<div className="ptbar"><small>${pt.msg||`Path tracing · ${Math.floor(pt.samples)} of ${pt.target} samples`}</small><div className="track"><i style=${{width:Math.min(100,pt.samples/pt.target*100)+'%'}}></i></div></div><button className="btn" onClick=${()=>{ptStop.current.stop=true}}>Stop</button>`
     :html`<button className="btn" disabled=${!!pt||!!rend} onClick=${()=>runPT([lb])}>${rend?'Waiting for previews…':ptDone[lb]?`Photoreal · ${ptDone[lb]} samples · redo`:'Render photoreal'}</button>`}
    ${ptErr&&!pt&&html`<p className="lberr" role="alert">${ptErr}</p>`}
    <button className="btn pri" onClick=${()=>{const id=lb;setLb(null);go360(id)}}>View in 360°</button><button className="ib" onClick=${()=>setLb(null)} aria-label="Close">✕</button></div></div>`}
  <div className=${'loader'+(boot?'':' done')} aria-hidden=${!boot}>
   <div className="lw"><${Plan} loading/><h1>Residence walkthrough</h1>
    ${(err||perr)&&boot?html`<p>${err||perr}</p>`:html`<div className="bar"><i style=${{width:Math.round((pmsg?1:engBusy?prog.p:.08)*100)+'%'}}></i></div><p>${pmsg||(engBusy?prog.m:view==='tour'?'Opening the 360° tour':'Loading the 3D model')}…</p>`}</div></div>
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>
</body>
</html>
